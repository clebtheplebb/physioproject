<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive educational simulation showing how different diets affect kidney nephrons. Explore the impact of high sodium and high protein foods on kidney health.">
    <title>Kidney Nephron Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="bgGradient" class="bg-gradient"></div>
    <canvas id="simCanvas"></canvas>

    <div id="particleLegend" class="particle-legend" aria-hidden="false">
        <h4>Particles</h4>
        <ul>
            <li><span class="dot rbc" aria-hidden="true"></span> Red blood cell</li>
            <li><span class="dot water" aria-hidden="true"></span> Water</li>
            <li><span class="dot sodium" aria-hidden="true"></span> Sodium (Na+)</li>
            <li><span class="dot protein" aria-hidden="true"></span> Protein</li>
            <li><span class="dot urea" aria-hidden="true"></span> Urea</li>
            <li><span class="dot creatinine" aria-hidden="true"></span> Creatinine</li>
        </ul>
    </div>
    <button id="backButton" class="back-button hidden" aria-label="Back to food selection">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Back to Menu</span>
    </button>
    <div id="foodSelection" class="food-selection">
        <div class="food-selection-inner">
            <header class="food-header">
                <h1 id="mainTitle">How Does Your Diet<br>Affect Your Kidneys?</h1>
            </header>
            <div id="foodGrid" class="food-grid">
            </div>
        </div>
    </div>
    <div id="eatingScene" class="eating-scene hidden">
        <div class="eating-container">
            <div class="eating-arena">
                <div class="person-container">
                    <div id="silhouetteContainer" class="human-silhouette-container">
                        <svg class="human-silhouette" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <!-- Head -->
                            <circle cx="360" cy="100" r="45" fill="#6b7280"/>
                            
                            <!-- Neck -->
                            <rect x="345" y="140" width="30" height="25" fill="#6b7280"/>
                            
                            <!-- Torso -->
                            <path d="M330 165 Q330 200 340 240 L380 240 Q390 200 390 165 Z" fill="#6b7280"/>
                            
                            <!-- Left Arm -->
                            <path d="M330 180 Q300 190 280 220" fill="none" stroke="#6b7280" stroke-width="22" stroke-linecap="round"/>
                            
                            <!-- Right Arm -->
                            <path d="M390 180 Q420 190 440 220" fill="none" stroke="#6b7280" stroke-width="22" stroke-linecap="round"/>
                            
                            <!-- Left Leg -->
                            <path d="M350 240 L345 340" fill="none" stroke="#6b7280" stroke-width="20" stroke-linecap="round"/>
                            
                            <!-- Right Leg -->
                            <path d="M370 240 L375 340" fill="none" stroke="#6b7280" stroke-width="20" stroke-linecap="round"/>
                            
                            <!-- Eyes -->
                            <circle cx="345" cy="90" r="4" fill="#f3f4f6"/>
                            <circle cx="375" cy="90" r="4" fill="#f3f4f6"/>
                            <circle cx="345" cy="90" r="2" fill="#6b7280"/>
                            <circle cx="375" cy="90" r="2" fill="#6b7280"/>
                            
                            <!-- Smile -->
                            <path d="M348 102 Q360 108 372 102" fill="none" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>

                            <path id="digestPath" class="digest-path" d="M360 105 C360 140 360 175 360 210 C360 250 360 290 360 340" fill="none" stroke="#dc2626" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
                            <path d="M360 105 C360 140 360 175 360 210 C360 250 360 290 360 340" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

                            <path id="mouthTarget" d="M350 105 C350 102 370 102 370 105 C370 110 350 110 350 105 Z" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4"/>
                            <path d="M355 108 C357 115 363 115 365 108" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
                            <path d="M360 115 C360 140 360 165 360 195" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
                            <path d="M360 195 C360 230 360 260 360 290" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
                            <path d="M360 290 C360 310 360 325 360 340" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>

                            <path id="stomachTarget" d="M340 210 C340 195 380 195 380 210 C380 230 340 230 340 210 Z" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="2"/>

                            <path id="leftKidney" class="kidney" d="M225 180 C205 175 195 185 192 205 C190 220 195 235 210 242 C230 250 248 245 252 225 C255 205 245 185 225 180 Z" fill="#d1d5db"/>
                            <path id="rightKidney" class="kidney" d="M495 180 C515 175 525 185 528 205 C530 220 525 235 510 242 C490 250 472 245 468 225 C465 205 475 185 495 180 Z" fill="#d1d5db"/>

                            <g id="foodBolus" class="food-bolus" opacity="0">
                                <circle cx="0" cy="0" r="10" fill="#f0cf4f" stroke="#8b0000" stroke-width="3"/>
                                <animateMotion id="bolusMotion" begin="indefinite" dur="1.45s" fill="freeze" rotate="auto">
                                    <mpath href="#bolusPath" xlink:href="#bolusPath"></mpath>
                                </animateMotion>
                            </g>

                            <path id="bolusPath" d="M360 108 C360 135 360 160 360 190 C360 230 360 270 360 310 C360 325 360 335 360 340" fill="none" stroke="none"/>
                        </svg>
                    </div>
                </div>


                <div id="foodSidePanel" class="food-side-panel">
                    <div class="food-side-panel-card">
                        <p class="food-side-panel-hint">Drag the food into the mouth.</p>
                    </div>
                    <div id="draggableFood" class="draggable-food">
                        <img id="draggableFoodImage" alt="Selected food" />
                    </div>
                </div>
            </div>
            <button id="cancelEatingBtn" class="cancel-eating-btn">Choose Another Food</button>
        </div>
    </div>
    <div id="infoOverlay" class="info-overlay hidden">
        <div class="info-box">
            <button id="infoBack" class="info-back-btn" type="button">← Back</button>

            <div class="info-content">
                <h2 id="infoTitle" class="info-title"></h2>
                <div id="infoBody" class="info-body"></div>
            </div>

            <button id="infoContinue" class="info-continue" aria-label="Continue animation">
                <span>Continue</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 6 15 12 9 18"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Preparing simulation...</p>
    </div>

    <script src="js/nephron.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/infobox.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
